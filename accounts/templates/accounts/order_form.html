{% extends 'accounts/base.html' %}
{% block title %}Yangi zakaz — Textile MS{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl">

    <nav class="mb-6 flex items-center gap-2 text-sm t-secondary">
        <a href="{% url 'buyer_dashboard' %}" class="hover:underline">Kabinet</a>
        <i data-lucide="chevron-right" class="h-3.5 w-3.5"></i>
        <span class="font-medium t-primary">Yangi zakaz</span>
    </nav>

    <div class="mb-6">
        <p class="text-xs font-semibold uppercase tracking-widest t-teal">Zakaz</p>
        <h1 class="mt-2 text-3xl font-bold tracking-tight t-primary">Yangi zakaz berish</h1>
        <p class="mt-1 text-sm t-secondary">Dizayn tanlang va miqdorni kiriting</p>
    </div>

    <form method="post" class="rounded-2xl border card p-6 shadow-sm space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium t-secondary mb-1.5" for="design">
                Dizayn <span class="text-rose-500">*</span>
            </label>
            <select id="design" name="design" required class="field w-full rounded-xl border px-4 py-3 text-sm">
                <option value="">— Tanlang —</option>
                {% for d in designs %}
                    <option value="{{ d.id }}" {% if selected_design.id == d.id %}selected{% endif %}>{{ d.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium t-secondary mb-1.5" for="quantity">
                Miqdor (dona) <span class="text-rose-500">*</span>
            </label>
            <div class="flex items-center gap-3">
                <button type="button" id="qty-minus"
                        class="qty-btn grid h-11 w-11 shrink-0 place-items-center rounded-xl border transition-colors">
                    <i data-lucide="minus" class="h-4 w-4"></i>
                </button>
                <input id="quantity" name="quantity" type="number" min="1" value="1" required
                       class="field w-full rounded-xl border px-4 py-3 text-center text-sm font-semibold">
                <button type="button" id="qty-plus"
                        class="qty-btn grid h-11 w-11 shrink-0 place-items-center rounded-xl border transition-colors">
                    <i data-lucide="plus" class="h-4 w-4"></i>
                </button>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium t-secondary mb-1.5" for="note">
                Izoh <span class="t-muted font-normal">(ixtiyoriy)</span>
            </label>
            <textarea id="note" name="note" rows="4"
                      class="field w-full rounded-xl border px-4 py-3 text-sm resize-none"
                      placeholder="O'lcham, muddat yoki qo'shimcha talablar..."></textarea>
        </div>

        <div class="flex items-center gap-3 pt-2">
            <button type="submit"
                    class="inline-flex items-center gap-2 rounded-xl bg-teal-500 px-6 py-3 text-sm font-semibold text-white shadow-md hover:bg-teal-600 transition-colors">
                <i data-lucide="send" class="h-4 w-4"></i>Yuborish
            </button>
            <a href="{% url 'buyer_dashboard' %}"
               class="inline-flex items-center gap-2 rounded-xl border px-5 py-3 text-sm font-medium t-secondary hover:bg-zinc-50 transition-colors" style="border-color:#e4e4e7">
                Bekor qilish
            </a>
        </div>
    </form>
</section>
{% endblock %}

{% block extra_js %}
<script>
    var qtyInput = document.getElementById('quantity');
    document.getElementById('qty-minus').addEventListener('click', function(){
        var v = parseInt(qtyInput.value) || 1;
        if(v > 1) qtyInput.value = v - 1;
    });
    document.getElementById('qty-plus').addEventListener('click', function(){
        var v = parseInt(qtyInput.value) || 1;
        qtyInput.value = v + 1;
    });
</script>
{% endblock %}
