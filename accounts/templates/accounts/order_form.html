{% extends 'accounts/base.html' %}
{% block title %}Yangi zakaz{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl">
    <p class="text-sm font-medium uppercase tracking-[.24em] text-teal-300">Zakaz</p>
    <h1 class="mt-3 text-3xl font-semibold tracking-tight">Yangi zakaz berish</h1>
    <form method="post" class="mt-8 rounded-lg border border-zinc-200 bg-white p-6 shadow-sm dark:border-white/10 dark:bg-white/[.06]">
        {% csrf_token %}
        <label class="block text-sm text-zinc-700 dark:text-zinc-300" for="design">Dizayn</label>
        <select id="design" name="design" required class="mt-2 w-full rounded-lg border border-zinc-200 bg-white px-4 py-3 outline-none ring-teal-400/40 focus:ring-4 dark:border-white/10 dark:bg-zinc-950/70">
            <option value="">Tanlang</option>
            {% for design in designs %}
                <option value="{{ design.id }}" {% if selected_design.id == design.id %}selected{% endif %}>{{ design.name }}</option>
            {% endfor %}
        </select>
        <label class="mt-5 block text-sm text-zinc-700 dark:text-zinc-300" for="note">Izoh</label>
        <textarea id="note" name="note" rows="5" class="mt-2 w-full rounded-lg border border-zinc-200 bg-white px-4 py-3 outline-none ring-teal-400/40 focus:ring-4 dark:border-white/10 dark:bg-zinc-950/70" placeholder="O'lcham, muddat yoki qo'shimcha talablar"></textarea>
        <button class="mt-6 inline-flex items-center gap-2 rounded-lg bg-teal-500 px-5 py-3 font-semibold text-white hover:bg-teal-600 dark:bg-teal-400 dark:text-zinc-950 dark:hover:bg-teal-300"><i data-lucide="send" class="h-4 w-4"></i>Yuborish</button>
    </form>
</section>
{% endblock %}
