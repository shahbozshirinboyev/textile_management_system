{% extends 'accounts/base.html' %}
{% block title %}Account kerak{% endblock %}
{% block content %}
<section class="mx-auto grid max-w-3xl gap-5 md:grid-cols-2">
    <a href="{% url 'signup' %}?next={{ next_url|urlencode }}" class="rounded-lg border border-teal-500/30 bg-teal-500/10 p-7 hover:bg-teal-500/15 dark:border-teal-400/30 dark:bg-teal-400/10 dark:hover:bg-teal-400/15">
        <i data-lucide="user-plus" class="h-8 w-8 text-teal-300"></i>
        <h1 class="mt-5 text-2xl font-semibold">Ro'yxatdan o'tish</h1>
        <p class="mt-2 text-sm text-zinc-600 dark:text-zinc-400">Yangi buyer account ochib, tanlangan dizayn bo'yicha buyurtmani davom ettiring.</p>
    </a>
    <a href="{% url 'login' %}?next={{ next_url|urlencode }}" class="rounded-lg border border-zinc-200 bg-white p-7 shadow-sm hover:bg-zinc-50 dark:border-white/10 dark:bg-white/[.06] dark:hover:bg-white/10">
        <i data-lucide="log-in" class="h-8 w-8 text-teal-300"></i>
        <h2 class="mt-5 text-2xl font-semibold">Accountga kirish</h2>
        <p class="mt-2 text-sm text-zinc-600 dark:text-zinc-400">Mavjud username va parol bilan kirib, buyurtmani yakunlang.</p>
    </a>
</section>
{% endblock %}
