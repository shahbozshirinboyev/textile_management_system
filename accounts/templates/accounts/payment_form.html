{% extends 'accounts/base.html' %}
{% block title %}To'lov yuborish{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl">
    <p class="text-sm font-medium uppercase tracking-[.24em] text-teal-300">To'lov</p>
    <h1 class="mt-3 text-3xl font-semibold tracking-tight">To'lov cheki yuborish</h1>
    <form method="post" enctype="multipart/form-data" class="mt-8 rounded-lg border border-zinc-200 bg-white p-6 shadow-sm dark:border-white/10 dark:bg-white/[.06]">
        {% csrf_token %}
        <label class="block text-sm text-zinc-700 dark:text-zinc-300" for="order">Zakaz</label>
        <select id="order" name="order" required class="mt-2 w-full rounded-lg border border-zinc-200 bg-white px-4 py-3 outline-none ring-teal-400/40 focus:ring-4 dark:border-white/10 dark:bg-zinc-950/70">
            <option value="">Tanlang</option>
            {% for order in orders %}
                <option value="{{ order.id }}" {% if selected_order.id == order.id %}selected{% endif %}>#{{ order.id }} · {{ order.design.name }}</option>
            {% endfor %}
        </select>
        <label class="mt-5 block text-sm text-zinc-700 dark:text-zinc-300" for="amount">Summa</label>
        <input id="amount" name="amount" type="number" step="0.01" min="0" required class="mt-2 w-full rounded-lg border border-zinc-200 bg-white px-4 py-3 outline-none ring-teal-400/40 focus:ring-4 dark:border-white/10 dark:bg-zinc-950/70">
        <label class="mt-5 block text-sm text-zinc-700 dark:text-zinc-300" for="receipt_image">Chek rasmi</label>
        <input id="receipt_image" name="receipt_image" type="file" accept="image/*" class="mt-2 w-full rounded-lg border border-zinc-200 bg-white px-4 py-3 text-sm outline-none ring-teal-400/40 file:mr-4 file:rounded-md file:border-0 file:bg-teal-500 file:px-3 file:py-2 file:font-semibold file:text-white focus:ring-4 dark:border-white/10 dark:bg-zinc-950/70 dark:file:bg-teal-400 dark:file:text-zinc-950">
        <button class="mt-6 inline-flex items-center gap-2 rounded-lg bg-teal-500 px-5 py-3 font-semibold text-white hover:bg-teal-600 dark:bg-teal-400 dark:text-zinc-950 dark:hover:bg-teal-300"><i data-lucide="upload" class="h-4 w-4"></i>Yuborish</button>
    </form>
</section>
{% endblock %}
