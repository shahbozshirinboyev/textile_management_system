<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ro'yxatdan o'tish</title>
    <script>
        tailwind = { config: { darkMode: 'class' } };
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', savedTheme ? savedTheme === 'dark' : prefersDark);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-950 dark:bg-zinc-950 dark:text-zinc-100">
    <button id="theme-toggle" class="fixed right-4 top-4 grid h-10 w-10 place-items-center rounded-lg border border-zinc-200 bg-white hover:bg-zinc-100 dark:border-white/10 dark:bg-zinc-950/70 dark:hover:bg-white/10" title="Theme">
        <i data-lucide="sun" class="hidden h-4 w-4 dark:block"></i>
        <i data-lucide="moon" class="h-4 w-4 dark:hidden"></i>
    </button>
    <div class="grid min-h-screen place-items-center bg-[radial-gradient(circle_at_top,rgba(20,184,166,.14),transparent_34rem),linear-gradient(135deg,#fafafa,#f4f4f5)] px-4 dark:bg-[radial-gradient(circle_at_top,rgba(20,184,166,.2),transparent_34rem),linear-gradient(135deg,#09090b,#18181b)]">
        <form method="post" class="w-full max-w-md rounded-xl border border-zinc-200 bg-white p-8 shadow-2xl backdrop-blur dark:border-white/10 dark:bg-white/[.06]">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="mb-8">
                <p class="text-sm font-medium uppercase tracking-[.28em] text-teal-300">Buyer account</p>
                <h1 class="mt-3 text-3xl font-semibold tracking-tight">Ro'yxatdan o'tish</h1>
            </div>
            {% if form.errors %}
                <div class="mb-5 rounded-lg border border-rose-400/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-700 dark:text-rose-100">
                    Ma'lumotlarni tekshirib qayta urinib ko'ring.
                </div>
            {% endif %}
            <label class="block text-sm text-zinc-700 dark:text-zinc-300" for="id_username">Username</label>
            <input class="mt-2 w-full rounded-lg border border-zinc-200 bg-white px-4 py-3 outline-none ring-teal-400/40 focus:ring-4 dark:border-white/10 dark:bg-zinc-950/70" id="id_username" name="username" required value="{{ form.username.value|default:'' }}">
            <label class="mt-5 block text-sm text-zinc-700 dark:text-zinc-300" for="id_password1">Parol</label>
            <input class="mt-2 w-full rounded-lg border border-zinc-200 bg-white px-4 py-3 outline-none ring-teal-400/40 focus:ring-4 dark:border-white/10 dark:bg-zinc-950/70" id="id_password1" name="password1" type="password" required>
            <label class="mt-5 block text-sm text-zinc-700 dark:text-zinc-300" for="id_password2">Parolni takrorlang</label>
            <input class="mt-2 w-full rounded-lg border border-zinc-200 bg-white px-4 py-3 outline-none ring-teal-400/40 focus:ring-4 dark:border-white/10 dark:bg-zinc-950/70" id="id_password2" name="password2" type="password" required>
            <button class="mt-7 w-full rounded-lg bg-teal-500 px-4 py-3 font-semibold text-white hover:bg-teal-600 dark:bg-teal-400 dark:text-zinc-950 dark:hover:bg-teal-300">Davom etish</button>
            <a href="{% url 'login' %}?next={{ next_url|urlencode }}" class="mt-5 block text-center text-sm text-teal-300 hover:text-teal-200">Account bor, kirish</a>
        </form>
    </div>
    <script>
        document.getElementById('theme-toggle')?.addEventListener('click', function () {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        lucide.createIcons();
    </script>
</body>
</html>
